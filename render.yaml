# Render Blueprint — BloodBridge FastAPI backend.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bloodbridge-api
    runtime: python
    plan: free          # sleeps after 15 min idle; ~1 min cold start
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BLOODBRIDGE_DATABASE_URL
        sync: false        # set ONCE in the Render dashboard to your managed
                           # Postgres URL, e.g. Neon: postgresql+psycopg://...?sslmode=require
                           # (free tier SQLite lives on an ephemeral disk - it is
                           # wiped on every restart/spin-down; keep the real URL
                           # out of this public repo)
      - key: BLOODBRIDGE_AUTH_SECRET
        generateValue: true
      - key: BLOODBRIDGE_APP_BASE_URL
        sync: false          # set to the live frontend URL after first deploy
      - key: BLOODBRIDGE_EXTRA_CORS_ORIGINS
        sync: false          # set to the live frontend URL after first deploy
      - key: BLOODBRIDGE_SEED_DEMO_DATA
        value: "true"
